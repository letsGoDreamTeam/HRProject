    "python-dotenv>=1.0.0",
    "psycopg2>=2.9.11",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "numpy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "openpyxl>=3.1.5",
    "apscheduler>=3.10.4",
